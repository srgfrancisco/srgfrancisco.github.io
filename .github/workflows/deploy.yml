name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        uses: withastro/action@v3
        with:
          # Both pins are load-bearing. The action defaults to Node 20, and
          # current pnpm requires node:sqlite, which only exists from Node 22 —
          # the default combination fails with ERR_UNKNOWN_BUILTIN_MODULE.
          # pnpm is pinned rather than @latest so CI resolves what was tested.
          node-version: 24
          package-manager: pnpm@11.17.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
